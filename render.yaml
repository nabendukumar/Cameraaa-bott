services:
  - type: web
    name: telegram-data-bot
    runtime: node
    buildCommand: "npx --yes pnpm@10 install --frozen-lockfile && npx pnpm@10 --filter @workspace/capture-page run build && npx pnpm@10 --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
